<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" />

<style>
  :root{
    --paper:#fbf6f6;
    --paper2:#f0e5e8;
    --ink:#33272b;
    --muted:#a38e94;
    --accent:#b03a55;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:"Cormorant Garamond",Georgia,serif;
    color:var(--ink);
    background:linear-gradient(175deg,var(--paper) 0%,var(--paper2) 100%);
    min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:40px 28px calc(40px + env(safe-area-inset-bottom));
    text-align:center;overflow:hidden;position:relative;
  }

  /* ---- the button ---- */
  .stage{display:flex;flex-direction:column;align-items:center}
  .heart-btn{
    appearance:none;border:0;background:transparent;cursor:pointer;padding:0;
    width:min(52vw,196px);height:min(52vw,196px);position:relative;
    display:grid;place-items:center;
    animation:breathe 7s ease-in-out infinite;
  }
  .heart-btn svg{width:100%;height:100%;overflow:visible}
  .hp{
    fill:transparent;stroke:var(--accent);stroke-width:1.3;
    transition:fill .55s ease, stroke .55s ease;
    filter:drop-shadow(0 8px 22px rgba(176,58,85,.16));
  }
  .heart-btn.filled .hp{fill:var(--accent);stroke:var(--accent)}
  .heart-btn:active{transform:scale(.97)}
  .heart-btn:focus-visible{outline:none}
  .heart-btn:focus-visible .hp{stroke-width:1.9}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}

  /* refined ripple ring on tap */
  .ring{
    position:absolute;left:50%;top:50%;width:min(52vw,196px);height:min(52vw,196px);
    margin-left:calc(min(52vw,196px)/-2);margin-top:calc(min(52vw,196px)/-2);
    border:1px solid var(--accent);border-radius:50%;pointer-events:none;
    opacity:.5;animation:ripple 1s ease-out forwards;
  }
  @keyframes ripple{to{transform:scale(1.7);opacity:0}}

  .name{
    margin-top:34px;font-style:italic;font-weight:500;
    font-size:clamp(26px,7.5vw,34px);line-height:1.1;letter-spacing:.01em;
  }
  .hint{
    margin-top:14px;font-family:system-ui,sans-serif;font-size:11px;font-weight:500;
    letter-spacing:.32em;text-transform:uppercase;color:var(--muted);
    transition:opacity .4s ease;min-height:14px;
  }

  .sms{
    display:inline-block;margin-top:20px;font-family:system-ui,sans-serif;
    font-size:11px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;
    color:var(--muted);text-decoration:none;
    border-bottom:1px solid rgba(163,142,148,.4);padding-bottom:3px;
    transition:color .25s ease,border-color .25s ease;
  }
  .sms:active{color:var(--accent);border-color:var(--accent)}

  /* easter egg */
  .monkey{
    position:absolute;right:6px;bottom:6px;
    font-size:22px;line-height:1;background:none;border:0;padding:8px;cursor:pointer;
    opacity:.22;transition:opacity .3s ease,transform .3s ease;z-index:4;
  }
  .monkey:hover{opacity:.55}
  .monkey:active{transform:scale(1.4) rotate(-12deg);opacity:1}
  .monkey.pop{animation:pop .5s ease}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.55) rotate(12deg)}100%{transform:scale(1)}}

  /* ---- home: 2x2 panel menu ---- */
  .home{
    position:fixed;inset:0;display:flex;flex-direction:column;
    padding:calc(18px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
  }
  .home-head{display:flex;align-items:baseline;justify-content:center;gap:12px;padding:0 4px 14px}
  .home-eyebrow{font-family:system-ui,sans-serif;font-size:10px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
  .home-title{font-style:italic;font-weight:500;font-size:clamp(22px,6.5vw,28px);line-height:1.1}
  .tile-wrap{position:relative;display:flex;min-height:0}
  .tile-wrap .tile{flex:1}
  .grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;width:100%;min-height:0}
  .tile{
    appearance:none;min-height:0;border:1px solid rgba(51,39,43,.13);border-radius:3px;
    background:rgba(255,255,255,.38);color:var(--ink);cursor:pointer;padding:16px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    font-family:inherit;transition:background .25s ease,border-color .25s ease,transform .2s ease;
  }
  .tile:active{transform:scale(.98);border-color:var(--accent);background:rgba(255,255,255,.6)}
  .tile svg{width:clamp(48px,16vw,72px);height:clamp(48px,16vw,72px);overflow:visible}
  .tile .hp-small{fill:transparent;stroke:var(--accent);stroke-width:1.6}
  .t-big{font-style:italic;font-weight:500;font-size:clamp(46px,16vw,72px);line-height:1;font-variant-numeric:lining-nums}
  .t-label{font-family:system-ui,sans-serif;font-size:10px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
  .tile.soon{cursor:default;border-style:dashed;background:transparent}
  .tile.soon .t-big{color:rgba(51,39,43,.22);font-style:normal;font-weight:400}
  .tile.soon:active{transform:none;border-color:rgba(51,39,43,.13)}

  /* ---- full-screen sub views (love, days, series) ---- */
  .view{
    position:fixed;inset:0;z-index:5;overflow-y:auto;-webkit-overflow-scrolling:touch;
    background:linear-gradient(175deg,var(--paper) 0%,var(--paper2) 100%);
    padding:calc(28px + env(safe-area-inset-top)) 24px calc(40px + env(safe-area-inset-bottom));
  }
  .view-top{position:absolute;top:calc(28px + env(safe-area-inset-top));left:24px;right:24px;display:flex;justify-content:space-between;align-items:center}
  .view.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}

  /* ---- days ---- */
  .days-num{font-style:italic;font-weight:500;font-size:clamp(84px,30vw,128px);line-height:.95;font-variant-numeric:lining-nums;color:var(--ink)}
  .days-label{margin-top:16px;font-family:system-ui,sans-serif;font-size:11px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
  .days-since{margin-top:26px;font-style:italic;font-size:22px}
  .days-split{margin-top:6px;font-size:19px;color:var(--muted);font-style:italic}
  .days-next{margin-top:40px;padding-top:18px;border-top:1px solid rgba(51,39,43,.12);font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.06em;color:var(--muted);min-width:220px}
  .days-next b{color:var(--accent);font-weight:600}

  /* ---- series view ---- */
  .series{text-align:left}
  .series-inner{max-width:460px;margin:0 auto}
  .series-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}
  .back{
    background:none;border:0;padding:6px 0;cursor:pointer;
    font-family:system-ui,sans-serif;font-size:11px;font-weight:500;
    letter-spacing:.28em;text-transform:uppercase;color:var(--muted);
  }
  .series h2{font-style:italic;font-weight:500;font-size:clamp(28px,8vw,36px);margin:0 0 26px;line-height:1.1}
  .status{font-family:system-ui,sans-serif;font-size:11px;color:var(--muted);letter-spacing:.06em}

  .show{padding:22px 0;border-top:1px solid rgba(51,39,43,.12)}
  .show:last-child{border-bottom:1px solid rgba(51,39,43,.12)}
  .show-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
  .show-title{font-size:23px;font-weight:500;line-height:1.15;word-break:break-word}
  .del{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:4px 2px 4px 10px;cursor:pointer;opacity:.6;font-family:system-ui,sans-serif}
  .row{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px}
  .row-wrap{margin-top:14px}
  .who{font-family:system-ui,sans-serif;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .row.me .who{color:var(--ink)}
  .bar{height:3px;background:rgba(51,39,43,.1);border-radius:2px;overflow:hidden}
  .fill{height:100%;background:var(--muted);border-radius:2px;transition:width .5s ease}
  .row.me .fill{background:var(--accent)}
  .row .sum{font-family:system-ui,sans-serif;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:78px;text-align:right}
  .row.me .sum{color:var(--ink)}
  .controls{display:flex;gap:26px;margin:12px 0 4px 64px}
  .stepper{display:flex;flex-direction:column;gap:6px}
  .st-label{font-family:system-ui,sans-serif;font-size:10px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
  .st-line{display:flex;align-items:center;gap:6px}
  .st-num{width:44px;text-align:center;font-family:system-ui,sans-serif;font-size:16px;color:var(--ink);
    background:transparent;border:0;border-bottom:1px solid rgba(51,39,43,.25);border-radius:0;padding:4px 0;outline:none;
    -moz-appearance:textfield;font-variant-numeric:tabular-nums}
  .st-num:focus{border-bottom-color:var(--accent)}
  .st-num::-webkit-outer-spin-button,.st-num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .step{width:30px;height:30px;border-radius:50%;border:1px solid rgba(51,39,43,.2);background:transparent;color:var(--ink);font-size:16px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0;font-family:system-ui,sans-serif}
  .step:active{border-color:var(--accent);color:var(--accent)}
  .empty{font-style:italic;font-size:19px;color:var(--muted);padding:18px 0 6px}

  .add{margin-top:34px;display:grid;grid-template-columns:1fr 84px;gap:10px}
  .add input{font-family:inherit;font-size:19px;color:var(--ink);background:transparent;border:0;border-bottom:1px solid rgba(51,39,43,.25);padding:10px 2px;border-radius:0;outline:none;width:100%}
  .add input:focus{border-bottom-color:var(--accent)}
  .add input::placeholder{color:var(--muted);font-style:italic}
  .add button{grid-column:1 / -1;margin-top:10px;appearance:none;background:transparent;color:var(--ink);border:1px solid rgba(51,39,43,.22);border-radius:2px;font-family:inherit;font-size:19px;font-weight:500;padding:12px;cursor:pointer}
  .add button:active{background:rgba(176,58,85,.06);border-color:var(--accent)}

  /* ---- chooser ---- */
  .chooser{display:flex;flex-direction:column;align-items:center;gap:22px}
  .chooser .q{font-style:italic;font-size:clamp(24px,7vw,30px);color:var(--ink);margin:0}
  .picks{display:flex;flex-direction:column;gap:14px;width:100%;max-width:260px}
  .pick{
    appearance:none;background:transparent;color:var(--ink);
    border:1px solid rgba(51,39,43,.22);border-radius:2px;
    font-family:inherit;font-size:22px;font-weight:500;letter-spacing:.02em;
    padding:14px 28px;cursor:pointer;transition:background .25s ease,border-color .25s ease;
  }
  .pick:active{background:rgba(176,58,85,.06);border-color:var(--accent)}

  .hidden{display:none!important}

  @media (prefers-reduced-motion:reduce){
    .heart-btn{animation:none}
    .ring{display:none}
  }
</style>
</head>
<body>

  <!-- Screen 1: who are you (skipped when URL has ?me=leon / ?me=her) -->
  <div id="chooser" class="chooser hidden">
    <p class="q">Whose phone is this?</p>
    <div class="picks">
      <button class="pick" data-me="leon"></button>
      <button class="pick" data-me="her"></button>
    </div>
  </div>

  <!-- Home: 2x2 panel menu -->
  <main id="home" class="home hidden">
    <div class="home-head">
      <div class="home-title" id="homeTitle"></div>
    </div>
    <div class="grid">
      <div class="tile-wrap">
      <button class="tile" id="tLove" aria-label="Send a message">
        <svg viewBox="0 0 32 29.6" aria-hidden="true"><path class="hp-small" d="M23.6,0c-2.9,0-5.4,1.6-7.6,4.3C13.8,1.6,11.3,0,8.4,0C3.8,0,0,3.8,0,8.4c0,7.7,7.7,12,16,21.2c8.3-9.2,16-13.5,16-21.2C32,3.8,28.2,0,23.6,0z"/></svg>
        <span class="t-label">message</span>
      </button>
      <button class="monkey hidden" id="monkey" aria-label="send a monkey">🐵</button>
      </div>
      <button class="tile" id="tDays" aria-label="Days together">
        <span class="t-big" id="tDaysNum">–</span>
        <span class="t-label">days</span>
      </button>
      <button class="tile" id="tSeries" aria-label="Our series">
        <span class="t-big" id="tSeriesNum">–</span>
        <span class="t-label">series</span>
      </button>
      <div class="tile soon" aria-hidden="true">
        <span class="t-big">+</span>
        <span class="t-label">soon</span>
      </div>
    </div>
  </main>

  <!-- View: send love -->
  <section id="app" class="view center stage hidden" aria-label="Send love">
    <div class="view-top"><button class="back" data-back>&larr; back</button><span></span></div>
    <button class="heart-btn" id="send" aria-label="Send I love you">
      <svg viewBox="0 0 32 29.6" aria-hidden="true">
        <path class="hp" d="M23.6,0c-2.9,0-5.4,1.6-7.6,4.3C13.8,1.6,11.3,0,8.4,0C3.8,0,0,3.8,0,8.4c0,7.7,7.7,12,16,21.2c8.3-9.2,16-13.5,16-21.2C32,3.8,28.2,0,23.6,0z"/>
      </svg>
    </button>
    <div class="name" id="name"></div>
    <div class="hint" id="hint">tap the heart</div>
    <a class="sms" id="smsLink" href="#">send as a text instead</a>
  </section>

  <!-- View: days together -->
  <section id="days" class="view center hidden" aria-label="Days together">
    <div class="view-top"><button class="back" data-back>&larr; back</button><span></span></div>
    <div class="days-num" id="daysNum">–</div>
    <div class="days-label">days together</div>
    <div class="days-since">since 27 september 2025</div>
    <div class="days-split" id="daysSplit"></div>
    <div class="days-next" id="daysNext"></div>
  </section>


  <!-- Screen 3: what we're watching -->
  <section id="series" class="view series hidden" aria-label="Our series">
    <div class="series-inner">
      <div class="series-top">
        <button class="back" data-back>&larr; back</button>
        <span class="status" id="syncStatus">loading…</span>
      </div>
      <h2>what we're watching</h2>
      <div id="shows"></div>
      <form class="add" id="addForm" autocomplete="off">
        <input id="addTitle" placeholder="new series" maxlength="80" required />
        <input id="addTotal" type="number" inputmode="numeric" min="1" max="2000" placeholder="episodes" required />
        <button type="submit">add</button>
      </form>
    </div>
  </section>

<script>
  const params = new URLSearchParams(location.search);
  const chooser = document.getElementById("chooser");
  const app = document.getElementById("app");
  const home = document.getElementById("home");
  const enc = encodeURIComponent(MESSAGE);

  function start(me){
    const recipient = me === "leon" ? PEOPLE.her : PEOPLE.leon;
    document.getElementById("name").textContent = "for " + recipient.name;
    const btn = document.getElementById("send");
    const hint = document.getElementById("hint");
    let sending = false;
    btn.onclick = () => {
      if(sending) return; sending = true;
      btn.classList.add("filled");
      const ring = document.createElement("span");
      ring.className = "ring"; btn.appendChild(ring);
      setTimeout(()=>ring.remove(), 1000);
      hint.textContent = "sent with love";
      setTimeout(() => { location.href = `https://wa.me/${recipient.phone}?text=${enc}`; }, 550);
    };
    // SMS fallback — iOS uses & , Android uses ? before body=
    const sep = /iPhone|iPad|iPod/.test(navigator.userAgent) ? "&" : "?";
    document.getElementById("smsLink").href = `sms:${recipient.phone}${sep}body=${enc}`;

    // easter egg: send just the monkey, no text
    const monkey = document.getElementById("monkey");
    monkey.classList.remove("hidden");
    monkey.onclick = () => {
      monkey.classList.add("pop");
      setTimeout(() => monkey.classList.remove("pop"), 500);
      setTimeout(() => { location.href = `https://wa.me/${recipient.phone}?text=${encodeURIComponent("🐵")}`; }, 260);
    };

    initSeries(me);
    initDays();

    // home menu
    document.getElementById("homeTitle").textContent = `${PEOPLE.leon.name} & ${PEOPLE.her.name}`;
    document.getElementById("tLove").onclick = () => {
      btn.classList.remove("filled"); sending = false; hint.textContent = "tap the heart";
      openView("app");
    };
    document.getElementById("tDays").onclick = () => { updateDays(); openView("days"); };
    document.getElementById("tSeries").onclick = () => openView("series");
    document.querySelectorAll("[data-back]").forEach(b => b.onclick = closeViews);

    chooser.classList.add("hidden");
    home.classList.remove("hidden");
  }

  function openView(id){
    const v = document.getElementById(id);
    v.classList.remove("hidden"); v.scrollTop = 0;
    document.getElementById("monkey").classList.add("hidden");
  }
  function closeViews(){
    document.querySelectorAll(".view").forEach(v => v.classList.add("hidden"));
    document.getElementById("monkey").classList.remove("hidden");
  }

  /* ================= days together ================= */
  const START = {y:2025, m:9, d:27};   // 27 Sept 2025
  function todayParts(){ const t = new Date(); return {y:t.getFullYear(), m:t.getMonth()+1, d:t.getDate()}; }
  const utc = p => Date.UTC(p.y, p.m-1, p.d);
  function daysTogether(){ return Math.round((utc(todayParts()) - utc(START)) / 86400000); }
  function splitYMD(){
    const t = todayParts();
    let y = t.y - START.y, m = t.m - START.m, d = t.d - START.d;
    if(d < 0){ m -= 1; d += new Date(t.y, t.m - 1, 0).getDate(); }   // days in previous month
    if(m < 0){ y -= 1; m += 12; }
    const part = (n, w) => n ? `${n} ${w}${n === 1 ? "" : "s"}` : null;
    return [part(y,"year"), part(m,"month"), part(d,"day")].filter(Boolean).join(", ") || "today";
  }
  function nextMilestone(n){
    const steps = [100,200,300,365,400,500,600,700,730,800,900,1000];
    let target = steps.find(s => s > n);
    if(!target) target = Math.ceil((n+1)/500)*500;
    const date = new Date(utc(START) + target*86400000);
    const label = target % 365 === 0 ? `${target/365} year${target/365>1?"s":""}` : `${target} days`;
    const when = date.toLocaleDateString("en-GB", {day:"numeric", month:"long", year:"numeric", timeZone:"UTC"});
    return `next: <b>${label}</b> on ${when} \u00b7 in ${target - n} days`;
  }
  function updateDays(){
    const n = daysTogether();
    document.getElementById("tDaysNum").textContent = n;
    document.getElementById("daysNum").textContent = n;
    document.getElementById("daysSplit").textContent = splitYMD();
    document.getElementById("daysNext").innerHTML = nextMilestone(n);
  }
  function initDays(){
    updateDays();
    document.addEventListener("visibilitychange", () => { if(!document.hidden) updateDays(); });
  }

  /* ================= series tracker (shared via Firebase) ================= */
  const DB = "https://love-button-f5295-default-rtdb.europe-west1.firebasedatabase.app";
  let shows = {};
  let ME = "leon";
  let pendingRender = false;
  document.addEventListener("focusout", () => setTimeout(() => { if(pendingRender && !(document.activeElement && document.activeElement.classList.contains("st-num"))){ pendingRender = false; render(); } }, 50));

  function initSeries(me){
    ME = me;
    document.getElementById("addForm").onsubmit = addShow;
    listen();
  }

  function setStatus(t){ document.getElementById("syncStatus").textContent = t; }

  async function load(){
    try{
      const r = await fetch(`${DB}/shows.json`, {cache:"no-store"});
      if(!r.ok) throw new Error(r.status);
      shows = (await r.json()) || {};
      // don't yank the keyboard away while someone is typing a number
      if(document.activeElement && document.activeElement.classList.contains("st-num")) pendingRender = true;
      else render();
      setStatus("synced");
    }catch(e){ setStatus("offline"); }
  }

  // live updates: Firebase REST streaming; falls back to polling
  function listen(){
    load();
    if(!("EventSource" in window)){ setInterval(load, 10000); return; }
    let es;
    const connect = () => {
      es = new EventSource(`${DB}/shows.json`);
      const refresh = () => load();
      es.addEventListener("put", refresh);
      es.addEventListener("patch", refresh);
      es.onerror = () => { setStatus("reconnecting…"); };
      es.onopen = () => setStatus("synced");
    };
    connect();
    document.addEventListener("visibilitychange", () => { if(!document.hidden) load(); });
  }

  async function patchShow(id, data){
    shows[id] = {...shows[id], ...data}; render();
    try{
      const r = await fetch(`${DB}/shows/${id}.json`, {method:"PATCH", body:JSON.stringify(data)});
      if(!r.ok) throw new Error(r.status);
      setStatus("synced");
    }catch(e){ setStatus("couldn't save"); load(); }
  }

  async function addShow(ev){
    ev.preventDefault();
    const title = document.getElementById("addTitle").value.trim();
    const total = parseInt(document.getElementById("addTotal").value, 10);
    if(!title || !(total >= 1 && total <= 2000)) return;
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    const show = {title, total, leon:0, her:0, leonS:1, herS:1, created:Date.now()};
    shows[id] = show; render();
    try{
      const r = await fetch(`${DB}/shows/${id}.json`, {method:"PUT", body:JSON.stringify(show)});
      if(!r.ok) throw new Error(r.status);
      ev.target.reset(); setStatus("synced");
    }catch(e){ setStatus("couldn't save"); load(); }
  }

  async function removeShow(id){
    if(!confirm(`Remove "${shows[id].title}" for both of you?`)) return;
    delete shows[id]; render();
    try{ await fetch(`${DB}/shows/${id}.json`, {method:"DELETE"}); }catch(e){ load(); }
  }

  function setEpisode(id, n){
    const s = shows[id]; if(!s) return;
    n = Math.max(0, Math.min(s.total, n));
    if(n === (s[ME]||0)) return;
    patchShow(id, {[ME]: n});
  }

  function setSeason(id, season){
    const s = shows[id]; if(!s) return;
    season = Math.max(1, Math.min(99, season));
    if(season === (s[ME + "S"] || 1)) return;
    // new season: start again at episode 0
    patchShow(id, {[ME + "S"]: season, [ME]: 0});
  }

  function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }

  function row(id, s, who){
    const mine = who === ME;
    const n = s[who] || 0;
    const season = s[who + "S"] || 1;
    const wrap = el("div", "row-wrap" + (mine ? " me" : ""));
    const r = el("div", "row" + (mine ? " me" : ""));
    r.appendChild(el("div", "who", PEOPLE[who].name));
    const bar = el("div", "bar"); const fill = el("div", "fill");
    fill.style.width = (s.total ? Math.round(n / s.total * 100) : 0) + "%";
    bar.appendChild(fill); r.appendChild(bar);
    r.appendChild(el("span", "sum", `S${season} \u00b7 ${n} / ${s.total}`));
    wrap.appendChild(r);
    if(mine){
      const ctr = el("div", "controls");
      ctr.append(
        stepper("season", season, 1, 99, v => setSeason(id, v)),
        stepper("episode", n, 0, s.total, v => setEpisode(id, v))
      );
      wrap.appendChild(ctr);
    }
    return wrap;
  }

  // labelled  [-] [number] [+]  — the number is a real input: tap it to type
  function stepper(label, value, min, max, onSet){
    const box = el("div", "stepper");
    box.appendChild(el("span", "st-label", label));
    const line = el("div", "st-line");
    const minus = el("button", "step", "\u2212"); minus.type = "button"; minus.setAttribute("aria-label", label + " minus one");
    const inp = el("input", "st-num"); inp.type = "number"; inp.inputMode = "numeric";
    inp.min = min; inp.max = max; inp.value = value; inp.setAttribute("aria-label", label);
    const plus = el("button", "step", "+"); plus.type = "button"; plus.setAttribute("aria-label", label + " plus one");
    minus.onclick = () => onSet(value - 1);
    plus.onclick = () => onSet(value + 1);
    const commit = () => { const v = parseInt(inp.value, 10); if(!isNaN(v)) onSet(v); else inp.value = value; };
    inp.addEventListener("change", commit);
    inp.addEventListener("keydown", e => { if(e.key === "Enter"){ inp.blur(); } });
    inp.addEventListener("focus", () => inp.select());
    line.append(minus, inp, plus);
    box.appendChild(line);
    return box;
  }

  function render(){
    const box = document.getElementById("shows");
    box.innerHTML = "";
    const ids = Object.keys(shows).filter(id => shows[id] && shows[id].title)
      .sort((a,b) => (shows[b].created||0) - (shows[a].created||0));
    document.getElementById("tSeriesNum").textContent = ids.length;
    if(!ids.length){ box.appendChild(el("div", "empty", "nothing yet — add your first series below")); return; }
    const other = ME === "leon" ? "her" : "leon";
    ids.forEach(id => {
      const s = shows[id];
      const card = el("div", "show");
      const head = el("div", "show-head");
      head.appendChild(el("div", "show-title", s.title));
      const del = el("button", "del", "×"); del.setAttribute("aria-label", "remove series");
      del.onclick = () => removeShow(id);
      head.appendChild(del);
      card.append(head, row(id, s, ME), row(id, s, other));
      box.appendChild(card);
    });
  }

  const me = params.get("me");
  if(me === "leon" || me === "her"){
    start(me);
  } else {
    const btns = chooser.querySelectorAll(".pick");
    btns[0].textContent = PEOPLE.leon.name;
    btns[1].textContent = PEOPLE.her.name;
    btns.forEach(b => b.onclick = () => start(b.dataset.me));
    chooser.classList.remove("hidden");
  }
</script>
</body>
</html>
