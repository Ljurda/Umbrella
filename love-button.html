<style>
  :root{
    --plum:#2b1b3d;
    --plum2:#4a1f3d;
    --rose:#ff5e7e;
    --rose-soft:#ff8fa3;
    --cream:#fdeff4;
    --muted:#c9a9c4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:"Nunito",system-ui,sans-serif;
    color:var(--cream);
    background:radial-gradient(120% 120% at 50% 0%, var(--plum2) 0%, var(--plum) 55%, #1a1026 100%);
    min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 24px calc(32px + env(safe-area-inset-bottom));
    text-align:center;overflow:hidden;position:relative;
  }
  .eyebrow{
    font-size:13px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--muted);margin-bottom:6px;
  }
  h1{
    font-family:"Fraunces",serif;font-style:italic;font-weight:600;
    font-size:clamp(30px,9vw,44px);line-height:1.05;margin:0 0 40px;
    color:var(--cream);
  }
  h1 .to{color:var(--rose-soft)}

  /* the signature: a big beating heart button */
  .heart-btn{
    appearance:none;border:0;background:transparent;cursor:pointer;
    width:min(64vw,260px);height:min(64vw,260px);
    display:grid;place-items:center;position:relative;
    animation:beat 1.8s ease-in-out infinite;
  }
  .heart-btn:focus-visible{outline:3px solid var(--cream);outline-offset:8px;border-radius:50%}
  .heart-btn svg{width:100%;height:100%;filter:drop-shadow(0 12px 40px rgba(255,94,126,.55))}
  .heart-btn:active{transform:scale(.94)}
  @keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.06)}24%{transform:scale(1)}36%{transform:scale(1.04)}}

  .label{margin-top:26px;font-weight:700;font-size:18px;letter-spacing:.01em}
  .sub{margin-top:8px;color:var(--muted);font-size:14px}
  .sms-link{
    display:inline-block;margin-top:22px;color:var(--muted);
    font-size:13px;text-decoration:underline;text-underline-offset:3px;
  }

  /* "who are you" chooser (only shows if no ?me= in the URL) */
  .chooser{display:flex;flex-direction:column;gap:14px;align-items:center}
  .chooser p{color:var(--muted);margin:0 0 6px;font-size:15px}
  .pick{
    appearance:none;border:1.5px solid rgba(255,143,163,.5);background:rgba(255,255,255,.04);
    color:var(--cream);font-family:inherit;font-weight:700;font-size:17px;
    padding:16px 40px;border-radius:999px;cursor:pointer;min-width:220px;
  }
  .pick:active{transform:scale(.97)}
  .hidden{display:none!important}

  .float{position:absolute;pointer-events:none;font-size:26px;animation:rise 1.2s ease-out forwards}
  @keyframes rise{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translateY(-160px) scale(1.3)}}

  @media (prefers-reduced-motion:reduce){
    .heart-btn{animation:none}
    .float{display:none}
  }
</style>
</head>
<body>

  <!-- Screen 1: pick who you are (skipped if URL has ?me=leon or ?me=her) -->
  <div id="chooser" class="chooser hidden">
    <p>Whose phone is this?</p>
    <button class="pick" data-me="leon"></button>
    <button class="pick" data-me="her"></button>
  </div>

  <!-- Screen 2: the button -->
  <main id="app" class="hidden">
    <div class="eyebrow">one tap</div>
    <h1>send love to <span class="to" id="toName"></span></h1>

    <button class="heart-btn" id="send" aria-label="Send I love you">
      <svg viewBox="0 0 32 29.6" aria-hidden="true">
        <path fill="#ff5e7e" d="M23.6,0c-2.9,0-5.4,1.6-7.6,4.3C13.8,1.6,11.3,0,8.4,0C3.8,0,0,3.8,0,8.4c0,7.7,7.7,12,16,21.2c8.3-9.2,16-13.5,16-21.2C32,3.8,28.2,0,23.6,0z"/>
      </svg>
    </button>

    <div class="label" id="label">Tap the heart</div>
    <div class="sub">Opens WhatsApp with your message ready — just hit send.</div>
    <a href="#" id="smsLink" class="sms-link">send as a text message instead</a>
  </main>

<script>
  const params = new URLSearchParams(location.search);
  const chooser = document.getElementById("chooser");
  const app = document.getElementById("app");
  const enc = encodeURIComponent(MESSAGE);

  function start(me){
    const recipient = me === "leon" ? PEOPLE.her : PEOPLE.leon;
    document.getElementById("toName").textContent = recipient.name;
    document.getElementById("send").onclick = () => {
      burst();
      document.getElementById("label").textContent = "Sent with love \u2764\uFE0F";
      setTimeout(() => {
        location.href = `https://wa.me/${recipient.phone}?text=${enc}`;
      }, 450);
    };
    document.getElementById("smsLink").href = `sms:${recipient.phone}${smsSep()}body=${enc}`;
    chooser.classList.add("hidden");
    app.classList.remove("hidden");
  }

  // iOS uses & , Android uses ? before "body=" — & works on both when there's no other param
  function smsSep(){ return /iPhone|iPad|iPod/.test(navigator.userAgent) ? "&" : "?"; }

  function burst(){
    for(let i=0;i<8;i++){
      const s=document.createElement("span");
      s.className="float";s.textContent="\u2764\uFE0F";
      s.style.left=(35+Math.random()*30)+"%";
      s.style.bottom="42%";
      s.style.animationDelay=(Math.random()*.2)+"s";
      document.body.appendChild(s);
      setTimeout(()=>s.remove(),1400);
    }
  }

  const me = params.get("me");
  if(me === "leon" || me === "her"){
    start(me);
  } else {
    // show chooser, labelled with the real names
    const btns = chooser.querySelectorAll(".pick");
    btns[0].textContent = PEOPLE.leon.name;
    btns[1].textContent = PEOPLE.her.name;
    btns.forEach(b => b.onclick = () => start(b.dataset.me));
    chooser.classList.remove("hidden");
  }
</script>
</body>
</html>
